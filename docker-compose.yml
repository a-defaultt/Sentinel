version: '3.8'

services:
  sentinel:
    build: .
    container_name: project-sentinel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Wazuh rotates alerts.json (rename + recreate). A single-file bind
      # mount pins the old inode forever, so mount the directory instead
      # and point the app at the file inside it.
      - ALERTS_JSON_PATH=/app/wazuh-alerts/alerts.json
      # schedule.at("08:00") fires in container-local time (UTC by default)
      - TZ=${TZ:-Africa/Tunis}
    volumes:
      # Mount the Wazuh alerts DIRECTORY (adjust source path as needed)
      - /var/ossec/logs/alerts:/app/wazuh-alerts:ro
      # Persist ChromaDB memory
      - ./chroma_data:/app/chroma_data
      # Persist monthly digests and local data
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
